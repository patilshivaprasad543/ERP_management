server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-eclipse-development-secret-change-me-32chars-minimum}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
    bootstrap:
      enabled: ${ERP_BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${ERP_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe12345!}
